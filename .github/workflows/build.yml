name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - src/**/*
      - .github/workflows/**/*
      - package.json
  pull_request:
    branches: [ "main" ]
    paths:
      - src/**/*
      - .github/workflows/**/*
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x , 24.x ]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=none --json
      - run: npm run build --if-present
      - run: npm test
  publish:
    runs-on: ubuntu-latest
    environment: publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.x'
      - run: npm ci
      - run: npm run build
      - run: npm publish
